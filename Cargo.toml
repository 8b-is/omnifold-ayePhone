[workspace]
resolver = "2"
members = [
    "crates/omnifold-core",
    "crates/omnifold-cli",
]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2021"
license = "MIT"
authors = ["the constellation <cabotage@pm.me>", "8b-is <https://8b.is>"]
repository = "https://github.com/8b-is/omnifold-ayePhone"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
