# 8B.is Omnifold (ayePhone) — Ghostty Cybernetic Terminal Cockpit
# Palette: OS Void (#0F1219), Cybernetic Green (#00FF66), Luminance Orange (#FA5B1C),
#          Territory Teal (#00E5C9), Golden Reconcile (#FFD700)

font-family = JetBrainsMonoNL Nerd Font
font-size = 13
font-thicken = true

background = #0F1219
foreground = #00FF66
cursor-color = #FA5B1C
cursor-text = #0F1219
selection-background = #FFD700
selection-foreground = #0F1219

# ANSI 16 mapped to the 8B.is Omnifold Beta 5-color identity
palette = 0=#0F1219
palette = 1=#FA5B1C
palette = 2=#00FF66
palette = 3=#FFD700
palette = 4=#00E5C9
palette = 5=#FA5B1C
palette = 6=#00E5C9
palette = 7=#E8EDF5
palette = 8=#1E293B
palette = 9=#FF7043
palette = 10=#5CFF9D
palette = 11=#FFE566
palette = 12=#5CE6D6
palette = 13=#FF9770
palette = 14=#70D6FF
palette = 15=#FFFFFF

background-opacity = 0.94
background-blur = true
window-padding-x = 10
window-padding-y = 10
window-padding-balance = true
scrollback-limit = 200000

shell-integration = zsh
shell-integration-features = cursor,sudo,title

# Quick terminal top dropdown
quick-terminal-position = top
quick-terminal-screen = main
quick-terminal-animation-duration = 0
quick-terminal-autohide = true

# Explicit raw spacebar guard so macOS Full Keyboard Access (FKA) never swallows Space
keybind = space=text:\x20

# Cockpit keybindings
keybind = cmd+shift+9=reload_config
keybind = global:ctrl+grave_accent=toggle_quick_terminal
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down
keybind = cmd+shift+enter=toggle_split_zoom
