# 8B.is Omnifold (ayePhone) — 8b-is/kitty GPU Cockpit Configuration
# Palette: #0F1219 (OS Void) · #00FF66 (Cybernetic Green) · #FA5B1C (Luminance Orange)
#          #00E5C9 (Territory Teal) · #FFD700 (Golden Reconcile)

font_family      JetBrainsMonoNL Nerd Font
font_size        13.0

background            #0F1219
foreground            #00FF66
cursor                #FA5B1C
cursor_text_color     #0F1219
selection_background  #FFD700
selection_foreground  #0F1219

active_border_color   #00E5C9
inactive_border_color #1E293B
bell_border_color     #FA5B1C

tab_bar_style         powerline
active_tab_background #FA5B1C
active_tab_foreground #0F1219
inactive_tab_background #161C28
inactive_tab_foreground #00E5C9

color0  #0F1219
color1  #FA5B1C
color2  #00FF66
color3  #FFD700
color4  #00E5C9
color5  #FA5B1C
color6  #00E5C9
color7  #E8EDF5

allow_remote_control  yes
listen_on             unix:/tmp/omnifold-kitty.sock
enable_audio_bell     no
window_padding_width  8
