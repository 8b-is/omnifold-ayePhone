# 8B.is Omnifold (ayePhone) — Manual Fallback Tmux Layer (OS Void + Phosphor Green + Luminance Orange)

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g status-position top

set -g status-style "bg=#0F1219,fg=#00FF66"
set -g status-left "#[bg=#FA5B1C,fg=#0F1219,bold] 8B.is OMNIFOLD #[bg=#0F1219,fg=#00E5C9]  #S "
set -g status-left-length 40
set -g status-right "#[fg=#FFD700]ZENO:OK #[fg=#00E5C9]│ #[fg=#00FF66]MLX-QUANT:TERNARY #[bg=#FA5B1C,fg=#0F1219,bold] ayeOS "
set -g status-right-length 80

setw -g window-status-current-format "#[bg=#00E5C9,fg=#0F1219,bold] #I:#W "
setw -g window-status-format "#[bg=#161C28,fg=#8B9BB4] #I:#W "

set -g pane-border-style "fg=#1E293B"
set -g pane-active-border-style "fg=#FA5B1C"
